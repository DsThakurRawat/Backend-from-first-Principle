<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c1391c" />
  <title>Offline — Backend from First Principles</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fcfcfa;
      --fg: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #c1391c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #f2f2f0;
        --muted: #a3a3a3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
    }
    main { max-width: 28rem; }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>
      This page isn’t cached yet. Reconnect and open it once, or go back to
      chapters you’ve already visited — those stay available offline.
    </p>
    <p><a href="/">Back to home</a></p>
  </main>
</body>
</html>
